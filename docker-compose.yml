services:
  sintmaarten:
    image: ghcr.io/helmerznl/sintmaarten:latest
    container_name: sintmaarten
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "${PORT:-9888}"
    ports:
      - "${PORT:-9888}:${PORT:-9888}"
    volumes:
      # Map op de host voor je gegevens (zie DATA_PATH in .env). Gebruik bij stack-beheerders (Dockge, Portainer,
      # Komodo) een absoluut pad, bv. /mnt/user/appdata/sintmaarten; ./data ligt dan in de map van de beheerder.
      - ${DATA_PATH:-./data}:/data
