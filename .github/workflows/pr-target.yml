# Pull requests gaan naar beta. main ontvangt alleen een promotie-PR van beta (App-Guidance: project-baseline.md §20,
# promotion-runbook.md). De eigenaar maakt de check "only-from-beta" verplicht in de branch protection van main.
name: pr-target

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  only-from-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Require beta of this repository as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "beta" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main only come from beta (this one comes from '$HEAD_REPO:$HEAD_REF'). Target beta instead."
            exit 1
          fi
