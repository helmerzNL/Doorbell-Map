# Dependabot werkt op beta, net als iedereen: elke ingang heeft `target-branch: beta`, zodat versie-updates als PR naar beta
# gaan en via een promotie in productie komen (App-Guidance, project-baseline §20).
# Beveiligingsupdates negeren `target-branch` en gaan altijd naar de Default branch van de repository; die hoort daarom ook
# `beta` te zijn (Settings → General → Default branch).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
    ignore:
      # Het image draait de Node-versie waarop CI de tests draait (node-version in .github/workflows/), een LTS-versie.
      # Een nieuwe major (en zeker een oneven versie zonder LTS) kies je bewust, op beide plekken tegelijk.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
